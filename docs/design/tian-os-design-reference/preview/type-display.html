<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { padding: 24px; display: flex; align-items: center; gap: 28px; }
  .specimen { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 72px; color: #1A2A4F; letter-spacing: -0.03em; line-height: 1; }
  .meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .meta .name { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 17px; color: #1A2A4F; letter-spacing: -0.01em; }
  .meta .sub { font-family: 'Inter', sans-serif; font-size: 12px; color: #5B5F6E; line-height: 1.5; }
  .scale { display: flex; align-items: baseline; gap: 18px; margin-top: 12px; }
  .scale span { font-family: 'Fraunces', serif; font-weight: 600; color: #1A2A4F; letter-spacing: -0.02em; }
  .pangram { font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; color: #1A2A4F; line-height: 1.25; letter-spacing: -0.015em; max-width: 380px; }
</style></head>
<body>
  <div class="specimen">Aa</div>
  <div class="meta" style="flex: 1;">
    <div class="name">Fraunces · Display</div>
    <div class="sub">Variable serif · weights 400–700 · optical sizing enabled</div>
    <div class="pangram">A quiet room with one bright thing in it.</div>
    <div class="scale">
      <span style="font-size:14px">14</span>
      <span style="font-size:20px">20</span>
      <span style="font-size:28px">28</span>
      <span style="font-size:36px">36</span>
      <span style="font-size:44px">44</span>
    </div>
  </div>
</body></html>
