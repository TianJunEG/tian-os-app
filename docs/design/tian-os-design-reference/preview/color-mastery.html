<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', -apple-system, sans-serif; color: #1F2330; }
  body { padding: 22px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 12px; padding: 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .swatch .name { font-size: 11px; font-weight: 600; }
  .swatch .hex { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; }
  .title { font-size: 11px; font-weight: 600; color: #9A9DA9; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
</style></head><body>
  <div class="title">Mastery scale · heatmaps, skill graph, progression</div>
  <div class="row">
    <div class="swatch" style="background:#F3F1EA;color:#1F2330"><div class="name">0 · Unlearned</div><div class="hex">#F3F1EA</div></div>
    <div class="swatch" style="background:#DDE3F0;color:#1A2A4F"><div class="name">1 · Introduced</div><div class="hex">#DDE3F0</div></div>
    <div class="swatch" style="background:#B5C2DD;color:#1A2A4F"><div class="name">2 · Practising</div><div class="hex">#B5C2DD</div></div>
    <div class="swatch" style="background:#6B7FA8;color:#fff"><div class="name">3 · Approaching</div><div class="hex">#6B7FA8</div></div>
    <div class="swatch" style="background:#2E4477;color:#fff"><div class="name">4 · Proficient</div><div class="hex">#2E4477</div></div>
    <div class="swatch" style="background:#1A2A4F;color:#fff"><div class="name">5 · Mastered</div><div class="hex">#1A2A4F</div></div>
    <div class="swatch" style="background:#1A2A4F;color:#C9A23C;box-shadow:inset 0 0 0 2px #C9A23C;"><div class="name">★ Distinction</div><div class="hex">#1A2A4F + gold</div></div>
  </div>
</body></html>
