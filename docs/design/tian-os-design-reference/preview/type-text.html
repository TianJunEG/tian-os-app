<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { padding: 24px; display: flex; align-items: center; gap: 28px; font-family: 'Inter', sans-serif; }
  .specimen { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 72px; color: #1A2A4F; letter-spacing: -0.03em; line-height: 1; }
  .meta { flex: 1; }
  .meta .name { font-weight: 600; font-size: 17px; color: #1A2A4F; letter-spacing: -0.01em; margin-bottom: 4px; }
  .meta .sub { font-size: 12px; color: #5B5F6E; line-height: 1.5; margin-bottom: 12px; }
  .row { display: flex; gap: 16px; align-items: baseline; }
  .row > div { color: #1F2330; }
  .lbl { font-size: 10px; color: #9A9DA9; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
</style></head>
<body>
  <div class="specimen">Aa</div>
  <div class="meta">
    <div class="name">Inter · Text</div>
    <div class="sub">Weights 400 / 500 / 600 / 700 · tabular-nums on data</div>
    <div class="row" style="margin-bottom: 10px">
      <div style="font-size: 24px; font-weight: 600; letter-spacing: -0.01em">H1 · 24</div>
      <div style="font-size: 20px; font-weight: 600">H2 · 20</div>
      <div style="font-size: 17px; font-weight: 600">H3 · 17</div>
    </div>
    <div class="row">
      <div style="font-size: 15px">Body 15</div>
      <div style="font-size: 13px; color: #5B5F6E">Small 13</div>
      <div style="font-size: 11px; color: #5B5F6E; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600">MICRO 11</div>
    </div>
  </div>
</body></html>
