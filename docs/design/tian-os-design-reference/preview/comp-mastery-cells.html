<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', -apple-system, sans-serif; color: #1F2330; }
  body { padding: 22px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 12px; padding: 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .swatch .name { font-size: 11px; font-weight: 600; }
  .swatch .hex { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; }
  .title { font-size: 11px; font-weight: 600; color: #9A9DA9; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
</style></head><body>
  <div class="title">Mastery cells · heatmap atom</div>
  <div style="display:flex;gap:6px;align-items:center;padding:4px 0;">
    <span style="font-size:11px;color:#9A9DA9;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-right:6px;">Less</span>
    <div style="width:30px;height:30px;border-radius:6px;background:#F3F1EA;display:grid;place-items:center;color:#1A2A4F;font-size:10px;font-weight:600;">0</div><div style="width:30px;height:30px;border-radius:6px;background:#DDE3F0;display:grid;place-items:center;color:#1A2A4F;font-size:10px;font-weight:600;">1</div><div style="width:30px;height:30px;border-radius:6px;background:#B5C2DD;display:grid;place-items:center;color:#1A2A4F;font-size:10px;font-weight:600;">2</div><div style="width:30px;height:30px;border-radius:6px;background:#6B7FA8;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600;">3</div><div style="width:30px;height:30px;border-radius:6px;background:#2E4477;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600;">4</div><div style="width:30px;height:30px;border-radius:6px;background:#1A2A4F;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600;">5</div>
    <span style="font-size:11px;color:#9A9DA9;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin:0 6px;">More</span>
    <div style="width:30px;height:30px;border-radius:6px;background:#1A2A4F;box-shadow:inset 0 0 0 2px #C9A23C;display:grid;place-items:center;color:#C9A23C;font-size:10px;font-weight:600;">★</div>
    <span style="font-size:11px;color:#8E6F1F;font-weight:600;margin-left:2px;">Distinction</span>
  </div>
</body></html>
