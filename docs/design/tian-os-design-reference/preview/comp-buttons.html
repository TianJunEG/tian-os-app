<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', -apple-system, sans-serif; color: #1F2330; }
  body { padding: 22px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 12px; padding: 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .swatch .name { font-size: 11px; font-weight: 600; }
  .swatch .hex { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; }
  .title { font-size: 11px; font-weight: 600; color: #9A9DA9; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
</style></head><body>
  <div class="title">Buttons</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
    <button style="height:48px;padding:0 20px;background:#1A2A4F;color:#fff;border:none;border-radius:14px;font-family:'Inter';font-weight:600;font-size:15px;letter-spacing:-0.01em;">Start practice</button>
    <button style="height:48px;padding:0 20px;background:#fff;color:#1A2A4F;border:1px solid #EFEDE6;border-radius:14px;font-family:'Inter';font-weight:600;font-size:15px;">Secondary</button>
    <button style="height:48px;padding:0 20px;background:#C9A23C;color:#0E1A36;border:none;border-radius:14px;font-family:'Inter';font-weight:600;font-size:15px;">Gold accent</button>
    <button style="height:48px;padding:0 16px;background:transparent;color:#1A2A4F;border:none;border-radius:14px;font-family:'Inter';font-weight:600;font-size:15px;">Ghost</button>
    <button style="height:36px;padding:0 14px;background:#1A2A4F;color:#fff;border:none;border-radius:12px;font-family:'Inter';font-weight:600;font-size:13px;">Small</button>
  </div>
</body></html>
