<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', -apple-system, sans-serif; color: #1F2330; }
  body { padding: 22px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 12px; padding: 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .swatch .name { font-size: 11px; font-weight: 600; }
  .swatch .hex { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; }
  .title { font-size: 11px; font-weight: 600; color: #9A9DA9; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
</style></head><body>
  <div class="title">Progress · linear with optional gold gradient at mastery</div>
  <div style="display:flex;flex-direction:column;gap:14px;padding:6px 0;">
    <div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;color:#5B5F6E;font-weight:600;"><span>Practising</span><span style="color:#1A2A4F">52%</span></div>
      <div style="height:6px;border-radius:999px;background:#F3F1EA;overflow:hidden;"><div style="width:52%;height:100%;background:#2E4477;border-radius:999px;"></div></div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;color:#5B5F6E;font-weight:600;"><span>Approaching</span><span style="color:#1A2A4F">72%</span></div>
      <div style="height:6px;border-radius:999px;background:#F3F1EA;overflow:hidden;"><div style="width:72%;height:100%;background:#1A2A4F;border-radius:999px;"></div></div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;color:#5B5F6E;font-weight:600;"><span>Mastered</span><span style="color:#1A2A4F">95%</span></div>
      <div style="height:6px;border-radius:999px;background:#F3F1EA;overflow:hidden;"><div style="width:95%;height:100%;background:linear-gradient(90deg,#1A2A4F,#C9A23C);border-radius:999px;"></div></div>
    </div>
  </div>
</body></html>
