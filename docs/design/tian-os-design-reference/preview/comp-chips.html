<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', -apple-system, sans-serif; color: #1F2330; }
  body { padding: 22px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 12px; padding: 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .swatch .name { font-size: 11px; font-weight: 600; }
  .swatch .hex { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; }
  .title { font-size: 11px; font-weight: 600; color: #9A9DA9; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
</style></head><body>
  <div class="title">Chips & status pills</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 0;">
    <span style="height:28px;padding:0 12px;background:#F3F1EA;color:#1F2330;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;">P5 level</span>
    <span style="height:28px;padding:0 12px;background:#F1F4FA;color:#1A2A4F;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;">5 modules</span>
    <span style="height:28px;padding:0 12px;background:#F6EBC9;color:#8E6F1F;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;">★ Mastered</span>
    <span style="height:28px;padding:0 12px;background:#DEF0E8;color:#2F8F6F;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;">↑ Fast</span>
    <span style="height:28px;padding:0 12px;background:#F4DAD6;color:#B4453C;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;">Building</span>
    <span style="height:28px;padding:0 12px;background:#fff;color:#1F2330;border:1px solid #EFEDE6;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;">Outline</span>
    <span style="height:28px;padding:0 12px;background:#1A2A4F;color:#fff;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;">Active</span>
  </div>
</body></html>
