<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { padding: 24px; display: flex; align-items: center; gap: 28px; font-family: 'Inter', sans-serif; }
  .specimen { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 56px; color: #1A2A4F; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .meta { flex: 1; }
  .meta .name { font-weight: 600; font-size: 17px; color: #1A2A4F; letter-spacing: -0.01em; margin-bottom: 4px; }
  .meta .sub { font-size: 12px; color: #5B5F6E; line-height: 1.5; margin-bottom: 12px; }
  .eq { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; color: #1A2A4F; }
  .eq-bg { background: #FAFAF7; border-radius: 10px; padding: 10px 14px; display: inline-block; }
</style></head>
<body>
  <div class="specimen">3 ÷ ⁴⁄₅</div>
  <div class="meta">
    <div class="name">JetBrains Mono · Math & numerics</div>
    <div class="sub">For equation steps, column arithmetic, timers, mastery percentages</div>
    <div class="eq-bg" style="margin-bottom:8px">
      <span class="eq" style="font-size:18px">305 − 178 = <b style="color:#2F8F6F">127</b></span>
    </div><br>
    <span class="eq" style="font-size:14px; color:#5B5F6E">↑ tabular-nums keeps the column aligned ↑</span>
  </div>
</body></html>
