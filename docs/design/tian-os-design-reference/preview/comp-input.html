<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', -apple-system, sans-serif; color: #1F2330; }
  body { padding: 22px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 12px; padding: 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .swatch .name { font-size: 11px; font-weight: 600; }
  .swatch .hex { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; }
  .title { font-size: 11px; font-weight: 600; color: #9A9DA9; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
</style></head><body>
  <div class="title">Input · text field & numeric keypad atom</div>
  <div style="display:flex;gap:14px;align-items:center;padding:4px 0;">
    <input type="text" placeholder="What are you trying to learn?" style="flex:1;height:48px;padding:0 16px;background:#FAFAF7;border:1px solid #EFEDE6;border-radius:12px;font-family:'Inter';font-size:14px;color:#1F2330;outline:none;box-shadow:inset 0 1px 0 rgba(26,42,79,.04);" />
    <div style="display:flex;gap:6px;">
      <button style="width:48px;height:48px;border-radius:14px;background:#fff;border:1px solid #EFEDE6;font-family:'Fraunces',serif;font-size:22px;font-weight:500;color:#1A2A4F;">7</button>
      <button style="width:48px;height:48px;border-radius:14px;background:#fff;border:1px solid #EFEDE6;font-family:'Fraunces',serif;font-size:22px;font-weight:500;color:#1A2A4F;">8</button>
      <button style="width:48px;height:48px;border-radius:14px;background:#1A2A4F;border:none;color:#C9A23C;display:grid;place-items:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
      </button>
    </div>
  </div>
</body></html>
