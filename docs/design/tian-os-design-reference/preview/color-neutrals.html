<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', -apple-system, sans-serif; color: #1F2330; }
  body { padding: 22px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 12px; padding: 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .swatch .name { font-size: 11px; font-weight: 600; }
  .swatch .hex { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; }
  .title { font-size: 11px; font-weight: 600; color: #9A9DA9; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
</style></head><body>
  <div class="title">Neutrals · ink, paper, lines</div>
  <div class="row">
    <div class="swatch" style="background:#0E1320;color:#fff;">
    <div class="name">ink-900</div>
    <div class="hex">#0E1320</div>
  </div>
    <div class="swatch" style="background:#1F2330;color:#fff;">
    <div class="name">ink-700 · body</div>
    <div class="hex">#1F2330</div>
  </div>
    <div class="swatch" style="background:#5B5F6E;color:#fff;">
    <div class="name">ink-500</div>
    <div class="hex">#5B5F6E</div>
  </div>
    <div class="swatch" style="background:#9A9DA9;color:#fff;">
    <div class="name">ink-300</div>
    <div class="hex">#9A9DA9</div>
  </div>
    <div class="swatch" style="background:#FFFFFF;border:1px solid #EFEDE6;color:#1F2330;"><div class="name">paper</div><div class="hex">#FFFFFF</div></div>
    <div class="swatch" style="background:#FAFAF7;border:1px solid #EFEDE6;color:#1F2330;"><div class="name">ivory</div><div class="hex">#FAFAF7</div></div>
    <div class="swatch" style="background:#F3F1EA;color:#1F2330;"><div class="name">bone</div><div class="hex">#F3F1EA</div></div>
  </div>
</body></html>
