<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>

  <div class="title">Feedback states · correct / incorrect / hint</div>
  <div style="display:flex;flex-direction:column;gap:10px;padding:2px 0;">
