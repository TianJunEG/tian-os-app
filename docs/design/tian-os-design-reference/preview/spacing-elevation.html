<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', -apple-system, sans-serif; color: #1F2330; }
  body { padding: 22px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 12px; padding: 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .swatch .name { font-size: 11px; font-weight: 600; }
  .swatch .hex { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; }
  .title { font-size: 11px; font-weight: 600; color: #9A9DA9; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
</style></head><body>
  <div class="title">Elevation · navy-tinted shadows, never black</div>
  <div style="display:flex;align-items:center;gap:20px;padding:18px 6px;">
    <div style="flex:1;background:#fff;border:1px solid #EFEDE6;border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(26,42,79,.04),0 8px 24px -12px rgba(26,42,79,.06);">
      <div style="font-size:12px;font-weight:600;color:#1A2A4F;">Resting</div>
      <div style="font-size:10px;color:#5B5F6E;font-family:'JetBrains Mono';">8 / 24 / .06</div>
    </div>
    <div style="flex:1;background:#fff;border:1px solid #EFEDE6;border-radius:14px;padding:14px;box-shadow:0 4px 16px -4px rgba(26,42,79,.10),0 12px 40px -8px rgba(26,42,79,.08);">
      <div style="font-size:12px;font-weight:600;color:#1A2A4F;">Active</div>
      <div style="font-size:10px;color:#5B5F6E;font-family:'JetBrains Mono';">16 / 40 / .10</div>
    </div>
    <div style="flex:1;background:#fff;border:1px solid #EFEDE6;border-radius:14px;padding:14px;box-shadow:0 12px 32px -8px rgba(26,42,79,.16),0 24px 64px -16px rgba(26,42,79,.12);">
      <div style="font-size:12px;font-weight:600;color:#1A2A4F;">Overlay</div>
      <div style="font-size:10px;color:#5B5F6E;font-family:'JetBrains Mono';">32 / 64 / .16</div>
    </div>
    <div style="flex:1;background:#FAFAF7;border-radius:14px;padding:14px;box-shadow:inset 0 1px 0 rgba(26,42,79,.04);border:1px solid #EFEDE6;">
      <div style="font-size:12px;font-weight:600;color:#1A2A4F;">Inner well</div>
      <div style="font-size:10px;color:#5B5F6E;font-family:'JetBrains Mono';">inset 1px</div>
    </div>
  </div>
</body></html>
