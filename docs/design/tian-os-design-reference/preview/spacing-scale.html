<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', -apple-system, sans-serif; color: #1F2330; }
  body { padding: 22px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 12px; padding: 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .swatch .name { font-size: 11px; font-weight: 600; }
  .swatch .hex { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; }
  .title { font-size: 11px; font-weight: 600; color: #9A9DA9; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
</style></head><body>
  <div class="title">Spacing · 4 / 8 grid</div>
  <div style="display:flex;align-items:flex-end;gap:14px;padding:8px 0;">
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:4px;height:4px;background:#1A2A4F;border-radius:3px;"></div>
        <div style="font-family:'JetBrains Mono',mono;font-size:11px;color:#5B5F6E;font-variant-numeric:tabular-nums;">4</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:8px;height:8px;background:#1A2A4F;border-radius:3px;"></div>
        <div style="font-family:'JetBrains Mono',mono;font-size:11px;color:#5B5F6E;font-variant-numeric:tabular-nums;">8</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:12px;height:12px;background:#1A2A4F;border-radius:3px;"></div>
        <div style="font-family:'JetBrains Mono',mono;font-size:11px;color:#5B5F6E;font-variant-numeric:tabular-nums;">12</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:16px;height:16px;background:#1A2A4F;border-radius:3px;"></div>
        <div style="font-family:'JetBrains Mono',mono;font-size:11px;color:#5B5F6E;font-variant-numeric:tabular-nums;">16</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:24px;height:24px;background:#1A2A4F;border-radius:3px;"></div>
        <div style="font-family:'JetBrains Mono',mono;font-size:11px;color:#5B5F6E;font-variant-numeric:tabular-nums;">24</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:32px;height:32px;background:#1A2A4F;border-radius:3px;"></div>
        <div style="font-family:'JetBrains Mono',mono;font-size:11px;color:#5B5F6E;font-variant-numeric:tabular-nums;">32</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:48px;height:48px;background:#1A2A4F;border-radius:3px;"></div>
        <div style="font-family:'JetBrains Mono',mono;font-size:11px;color:#5B5F6E;font-variant-numeric:tabular-nums;">48</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:64px;height:64px;background:#1A2A4F;border-radius:3px;"></div>
        <div style="font-family:'JetBrains Mono',mono;font-size:11px;color:#5B5F6E;font-variant-numeric:tabular-nums;">64</div>
      </div>
    
  </div>
</body></html>
