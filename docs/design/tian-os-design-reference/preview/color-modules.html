<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', -apple-system, sans-serif; color: #1F2330; }
  body { padding: 22px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 12px; padding: 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .swatch .name { font-size: 11px; font-weight: 600; }
  .swatch .hex { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; }
  .title { font-size: 11px; font-weight: 600; color: #9A9DA9; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
</style></head><body>
  <div class="title">Module accents · used only within each module</div>
  <div class="row">
    <div class="swatch" style="background:#1A2A4F;color:#fff;">
    <div class="name">MathPath · navy</div>
    <div class="hex">#1A2A4F</div>
  </div>
    <div class="swatch" style="background:#2F6B7E;color:#fff;">
    <div class="name">Science · teal</div>
    <div class="hex">#2F6B7E</div>
  </div>
    <div class="swatch" style="background:#6B4F7E;color:#fff;">
    <div class="name">Spelling · aubergine</div>
    <div class="hex">#6B4F7E</div>
  </div>
    <div class="swatch" style="background:#7E5A2F;color:#fff;">
    <div class="name">Reading · bronze</div>
    <div class="hex">#7E5A2F</div>
  </div>
    <div class="swatch" style="background:#2F7E5A;color:#fff;">
    <div class="name">Planner · moss</div>
    <div class="hex">#2F7E5A</div>
  </div>
  </div>
</body></html>
