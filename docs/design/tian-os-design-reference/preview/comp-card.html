<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', -apple-system, sans-serif; color: #1F2330; }
  body { padding: 22px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 12px; padding: 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .swatch .name { font-size: 11px; font-weight: 600; }
  .swatch .hex { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; }
  .title { font-size: 11px; font-weight: 600; color: #9A9DA9; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
</style></head><body>
  <div class="title">Card · resting elevation, hairline border</div>
  <div style="display:flex;gap:12px;">
    <div style="flex:1;background:#fff;border:1px solid #EFEDE6;border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(26,42,79,.04),0 8px 24px -12px rgba(26,42,79,.06);">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:40px;height:40px;border-radius:13px;background:#1A2A4F;color:#fff;display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:600;font-size:18px;">∑</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:600;color:#1F2330;">MathPath</div>
          <div style="font-size:11px;color:#5B5F6E;margin-top:1px">Next · Equivalent fractions</div>
        </div>
        <div style="font-family:'Inter';font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:#1A2A4F">68%</div>
      </div>
      <div style="height:5px;border-radius:999px;background:#F3F1EA;overflow:hidden;margin-top:12px;"><div style="width:68%;height:100%;background:#1A2A4F;border-radius:999px;"></div></div>
    </div>
  </div>
</body></html>
