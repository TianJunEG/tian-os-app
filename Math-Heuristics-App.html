<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Heuristics Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#26324a; --muted:#586079; --line:#ebe6dc;
    --brand:#3b6ef6; --brand-dk:#2f57c9; --accent:#ff8a3d; --good:#15a06d; --bad:#e0455e;
    --u:#3b6ef6; --x1:#ff8a3d; --x2:#19a974; --x3:#9b6cf2;
    --shadow:0 12px 34px rgba(48,42,70,.10); --shadow-sm:0 4px 14px rgba(48,42,70,.07);
    --r:20px;
    --h1:#3b6ef6; --h2:#11a3c4; --h3:#9b6cf2; --h4:#ef8d2f; --h5:#e0455e; --h6:#19a974;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:ui-rounded,"Nunito","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;font-size:16.5px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  :focus-visible{outline:3px solid rgba(59,110,246,.55);outline-offset:2px;border-radius:8px}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px 80px}

  /* Header */
  header{position:sticky;top:0;z-index:40;background:rgba(247,245,240,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.18rem;letter-spacing:-.3px;cursor:pointer}
  .logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#7aa0ff);
    display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:var(--shadow-sm)}
  .spacer{flex:1}
  .lvlbox{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:4px;box-shadow:var(--shadow-sm)}
  .lvlbox button{width:34px;height:30px;border-radius:999px;font-weight:800;color:var(--muted);font-size:.92rem}
  .lvlbox button.on{background:var(--brand);color:#fff}
  .lvllabel{font-size:.72rem;color:var(--muted);font-weight:700;padding:0 6px;white-space:nowrap}
  .modetog{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow-sm)}
  .modetog button{padding:6px 14px;border-radius:999px;font-weight:700;color:var(--muted);font-size:.85rem}
  .modetog button.on{background:var(--ink);color:#fff}

  /* Hero / hub */
  .hero{background:linear-gradient(135deg,#ffe9d6 0%,#eaf1ff 50%,#f1e9ff 100%);border:1px solid var(--line);border-radius:26px;
    padding:30px 30px 26px;margin:22px 0;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .hero h1{margin:0 0 6px;font-size:1.95rem;letter-spacing:-.6px;font-weight:900}
  .hero p{margin:0;color:var(--muted);max-width:62ch;font-size:1.02rem}
  .levelpill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;margin-top:14px;box-shadow:var(--shadow-sm)}
  .levelpill b{color:var(--brand)}

  .udsc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 8px}
  .udsc .step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow-sm)}
  .udsc .step .k{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:900;margin-bottom:8px}
  .udsc .step h4{margin:0 0 3px;font-size:1rem}
  .udsc .step p{margin:0;font-size:.82rem;color:var(--muted)}

  .sectlabel{font-weight:800;font-size:1.15rem;margin:26px 4px 12px;letter-spacing:-.3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px}
  .hcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm);
    cursor:pointer;transition:transform .14s ease,box-shadow .14s ease;position:relative;overflow:hidden}
  .hcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .hcard .badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.05rem;margin-bottom:10px}
  .hcard h3{margin:0 0 4px;font-size:1.08rem}
  .hcard .tag{font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .hcard p{margin:8px 0 0;font-size:.86rem;color:var(--muted)}
  .hcard .prog{height:7px;border-radius:999px;background:var(--line);margin-top:12px;overflow:hidden}
  .hcard .prog i{display:block;height:100%;border-radius:999px;background:var(--good);width:0;transition:width .4s}
  .hcard .stars{font-size:.78rem;color:var(--muted);margin-top:6px;font-weight:700}

  .tool-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .toolcard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 18px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .14s,box-shadow .14s}
  .toolcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .toolcard .ic{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;color:#fff}
  .toolcard h3{margin:0 0 3px;font-size:1.05rem}
  .toolcard p{margin:0;font-size:.84rem;color:var(--muted)}
  /* 4-stage flow band (informational, not clickable) */
  .guideband{background:linear-gradient(135deg,#fff2e6,#eef3ff 60%,#f6f1ff);border:1px solid var(--line);border-radius:20px;padding:16px 18px 18px;margin:18px 0}
  .guideband .ttl{font-weight:800;font-size:1rem;margin-bottom:12px}
  .flowstrip{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
  .flownode{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .flownode .k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:900;margin-bottom:8px}
  .flownode h4{margin:0 0 2px;font-size:.95rem}
  .flownode p{margin:0;font-size:.78rem;color:var(--muted)}
  .flowarrow{display:flex;align-items:center;color:#b9c4da;font-weight:900;font-size:1.3rem;flex:0 0 auto}
  /* clickable affordances */
  .sectlabel .hint{font-weight:500;font-size:.82rem;color:var(--muted);margin-left:8px}
  .cardchev{position:absolute;top:14px;right:14px;width:27px;height:27px;border-radius:999px;background:#eef2fb;color:var(--brand);
    display:grid;place-items:center;font-weight:900;font-size:1.05rem;transition:all .14s;line-height:1}
  .hcard:hover .cardchev,.toolcard:hover .cardchev{background:var(--brand);color:#fff;transform:translateX(2px)}
  .openlink{margin-top:10px;color:var(--brand);font-weight:800;font-size:.82rem}
  @media(max-width:680px){.flowarrow{display:none}}

  /* Detail view */
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:700;margin:18px 0 8px;font-size:.9rem}
  .detailhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
  .detailhead .badge{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.3rem;flex:none}
  .detailhead h2{margin:0;font-size:1.5rem;letter-spacing:-.4px}
  .detailhead .tag{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .tabs{display:flex;gap:6px;margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;
    box-shadow:var(--shadow-sm);overflow-x:auto}
  .tabs button{padding:9px 16px;border-radius:999px;font-weight:700;color:var(--muted);white-space:nowrap;font-size:.9rem}
  .tabs button.on{background:var(--brand);color:#fff}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow-sm)}
  .panel h3{margin:0 0 10px}
  .lead{color:var(--muted)}

  /* Walkthrough */
  .problembox{background:#f0f5ff;border:1px solid #d9e4fb;border-radius:14px;padding:16px 18px;font-size:1.04rem;font-weight:600}
  .stage{border:1px solid var(--line);border-radius:14px;padding:0;margin-top:14px;overflow:hidden;opacity:1}
  .stage .sh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fafbff;border-bottom:1px solid var(--line)}
  .stage .sh .pin{font-size:.7rem;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#fff;padding:3px 9px;border-radius:999px}
  .stage .sh h4{margin:0;font-size:1rem}
  .stage .body{padding:16px}
  .stage .body p{margin:0 0 10px}
  .stage.hidden{display:none}
  .stepctrl{display:flex;gap:10px;align-items:center;margin-top:18px}
  .btn{background:linear-gradient(135deg,var(--brand),#5b86ff);color:#fff;font-weight:800;padding:12px 22px;border-radius:14px;
    box-shadow:0 6px 16px rgba(59,110,246,.28);transition:transform .1s,filter .1s,box-shadow .1s;font-size:.96rem}
  .btn:hover{filter:brightness(1.06);box-shadow:0 8px 20px rgba(59,110,246,.34)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#eef2fb;color:var(--ink);box-shadow:var(--shadow-sm)}
  .btn.ghost:hover{box-shadow:var(--shadow-sm)}
  .btn.sm{padding:8px 14px;font-size:.86rem}
  .btn[disabled]{opacity:.4;cursor:default}
  .progdots{display:flex;gap:6px;margin-left:auto}
  .progdots i{width:11px;height:11px;border-radius:999px;background:var(--line);cursor:pointer;transition:transform .1s}
  .progdots i:hover{transform:scale(1.25)}
  .progdots i.on{background:var(--brand);transform:scale(1.2)}
  .progdots i.done{background:var(--brand);opacity:.4}
  .stepnav{position:sticky;bottom:14px;z-index:6;display:flex;align-items:center;gap:12px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:16px 0 4px;box-shadow:0 8px 26px rgba(31,42,68,.18)}
  .stepcount{font-weight:800;color:var(--muted);font-size:.88rem}
  .phaserail{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:14px 0}
  .phasepill{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
    background:#eef2fb;border-radius:999px;padding:5px 11px;transition:all .15s}
  .phasepill.on{background:var(--h2);color:#fff;transform:scale(1.04)}
  .phasepill.done{background:#dff3ea;color:var(--good)}
  .phasesep{color:#c7d0e0;font-weight:800;font-size:.8rem}
  .levelbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f0f5ff;border:1px solid #d9e4fb;
    border-radius:12px;padding:10px 14px;margin:14px 0;font-size:.85rem;color:var(--ink)}
  .levelbar b{color:var(--brand)}
  .lvlbox button{position:relative}
  .modal-bg{position:fixed;inset:0;background:rgba(31,42,68,.45);display:grid;place-items:center;z-index:100;padding:20px;
    animation:fade .15s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal-card{background:var(--card);border-radius:18px;padding:24px 24px 20px;max-width:400px;box-shadow:var(--shadow);text-align:center}
  .modal-card h3{margin:0 0 8px;font-size:1.2rem}
  .modal-card p{margin:0 0 18px;color:var(--muted);font-size:.92rem}
  .modal-btns{display:flex;gap:10px;justify-content:center}
  .lockhint{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:5px;margin-left:4px}

  svg.viz{max-width:100%;height:auto;display:block}
  .vizwrap{background:#fbfcff;border:1px dashed #d9e1f1;border-radius:12px;padding:14px;margin-top:6px;overflow-x:auto}
  table.dtab{border-collapse:collapse;width:100%;font-size:.9rem}
  table.dtab th,table.dtab td{border:1px solid var(--line);padding:7px 9px;text-align:center}
  table.dtab th{background:#f3f6ff;font-weight:800}
  table.dtab td.hit{background:#e3f8ee;font-weight:800;color:var(--good)}
  table.dtab td.miss{color:var(--bad)}
  .eq{font-family:"Cambria Math",Georgia,serif;font-size:1.06rem;background:#fff7ef;border:1px solid #ffe2c4;
    border-radius:10px;padding:10px 14px;display:inline-block;margin:4px 0}

  /* Decision guide */
  .dq{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm)}
  .dq .q{font-size:1.15rem;font-weight:700;margin-bottom:16px}
  .dq .choices{display:flex;gap:12px}
  .dq .choices button{flex:1;padding:16px;border-radius:13px;font-weight:800;font-size:1rem;border:2px solid var(--line);background:#fafbff;transition:all .12s}
  .dq .choices button.yes:hover{border-color:var(--good);color:var(--good);background:#f0fbf6}
  .dq .choices button.no:hover{border-color:var(--bad);color:var(--bad);background:#fdf1f3}
  .flowmap{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .flowmap .node{display:flex;align-items:center;gap:10px;font-size:.86rem;color:var(--muted);padding:8px 12px;border-radius:10px;border:1px dashed var(--line)}
  .flowmap .node.active{border-style:solid;border-color:var(--brand);color:var(--ink);background:#f3f7ff;font-weight:700}
  .flowmap .node.passed{opacity:.45;text-decoration:line-through}
  .result{margin-top:18px;border-radius:16px;padding:20px;color:#fff;text-align:center}
  .result h3{margin:0 0 4px;font-size:1.4rem}
  .result p{margin:0 0 14px;opacity:.92}

  /* Practice */
  .pcard{background:#f0f5ff;border:1px solid #d9e4fb;border-radius:14px;padding:18px}
  .pq{font-size:1.08rem;font-weight:600;margin-bottom:14px}
  .ansrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ansrow input{font-size:1.05rem;padding:11px 14px;border:2px solid var(--line);border-radius:11px;width:160px;font-weight:700;font-family:inherit}
  .ansrow input:focus{outline:none;border-color:var(--brand)}
  .mcgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mcgrid button{padding:13px;border-radius:11px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:1rem;text-align:left}
  .mcgrid button:hover{border-color:var(--brand)}
  .mcgrid button.sel{border-color:var(--brand);background:#eef3ff}
  .mcgrid button.right{border-color:var(--good);background:#eafaf2;color:var(--good)}
  .mcgrid button.wrong{border-color:var(--bad);background:#fdeef1;color:var(--bad)}
  .feedback{margin-top:14px;border-radius:12px;padding:14px 16px;font-weight:600;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:#eafaf2;border:1px solid #b6ecd2;color:#0c7a52}
  .feedback.no{background:#fdeef1;border:1px solid #f6c9d2;color:#b32340}
  .feedback .sol{font-weight:500;margin-top:8px;color:var(--ink);font-size:.92rem}
  .scorebar{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .scorebadge{font-weight:800;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;box-shadow:var(--shadow-sm)}

  /* Builder */
  .builderbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .canvasrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px;border-radius:12px;border:2px solid transparent}
  .canvasrow.sel{border-color:var(--brand);background:#f6f9ff}
  .canvasrow .rname{width:108px;flex:none}
  .canvasrow .rname input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-weight:700;font-family:inherit;font-size:.86rem}
  .blocks{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:42px;flex:1}
  .blk{height:40px;min-width:42px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;padding:0 8px;
    box-shadow:var(--shadow-sm);animation:pop .18s ease}
  .blk.unit{background:var(--u)}
  .blk.num{background:var(--accent)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .rowtools{display:flex;gap:4px}
  .rowtools button{width:34px;height:34px;border-radius:9px;background:#eef2fb;color:var(--ink);font-weight:900;font-size:1.05rem}
  .readout{background:#fbfcff;border:1px dashed #d9e1f1;border-radius:12px;padding:14px;margin-top:6px;font-size:.92rem}
  .readout .row{display:flex;justify-content:space-between;padding:3px 0}
  .presetsel{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-weight:600}

  .note{background:#fff7ef;border:1px solid #ffe2c4;border-radius:12px;padding:13px 16px;font-size:.9rem;margin-top:14px}
  .note b{color:var(--accent)}
  .parentonly{display:none}
  body.parent .parentonly{display:block}
  .scopechips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:999px;background:#eef2fb;color:var(--muted)}
  .chip.on{background:#e3f8ee;color:var(--good)}
  .chip.off{opacity:.5;text-decoration:line-through}
  footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:44px;line-height:1.6}

  /* Decision-clue callout (lesson header) */
  .cluepill{display:inline-flex;align-items:center;gap:8px;background:#fff4ea;border:1px solid #ffdfc2;
    border-radius:999px;padding:6px 14px 6px 7px;margin-top:10px;font-size:.9rem;font-weight:600;color:var(--ink)}
  .cluelabel{font-size:.66rem;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:#fff;
    background:var(--accent);border-radius:999px;padding:4px 10px;white-space:nowrap}

  /* embedded model builder in practice */
  .drawwrap{margin-top:16px}
  .drawtoggle{display:inline-flex;align-items:center;gap:8px;background:#eef3ff;color:var(--brand);font-weight:800;
    padding:11px 18px;border-radius:12px;font-size:.92rem;border:1px solid #d9e4fb;transition:all .12s}
  .drawtoggle:hover{background:#e2ebff}
  .drawtoggle .pen{font-weight:900}
  .buildembed{background:#fbfcff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
  .buildembed .panel{background:none;border:none;box-shadow:none;padding:0}
  .drawcap{font-size:.84rem;color:var(--muted);margin:0 0 10px;font-weight:600}

  /* readability bumps */
  .hcard p{font-size:.9rem}
  .udsc .step p,.flownode p{font-size:.82rem}
  .tabs button{min-height:42px}
  .lvlbox button{min-width:34px}

  /* Responsive */
  @media(max-width:880px){ .wrap{padding:0 14px 70px} }
  @media(max-width:680px){
    .udsc{grid-template-columns:1fr 1fr}
    .tool-row{grid-template-columns:1fr}
    .mcgrid{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
    .hero{padding:22px 18px 20px;border-radius:22px}
    .hero h1{font-size:1.5rem}
    .hero p{font-size:.96rem}
    .bar{gap:10px;padding:10px 14px}
    .logo{font-size:1.05rem}
    .sectlabel{font-size:1.08rem}
    .detailhead h2{font-size:1.3rem}
    .detailhead .badge{width:46px;height:46px;font-size:1.1rem}
    .panel{padding:18px 16px}
    .dq{padding:16px}
    .dq .q{font-size:1.05rem}
  }
  @media(max-width:480px){
    .lvllabel{display:none}
    .lvlbox{padding:3px}
    .lvlbox button{width:32px;height:32px;min-width:32px}
    .modetog button{padding:6px 11px;font-size:.82rem}
    .flowstrip{flex-direction:column}
    .flownode{flex:1 1 auto}
    .stepnav{flex-wrap:wrap;gap:8px}
    .dq .choices{flex-direction:column}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo" onclick="go('home')"><span class="mark">∑</span><span>Math Heuristics Lab</span></div>
    <div class="spacer"></div>
    <div class="lvlbox" id="lvlbox" title="Choose level (Primary 1 to 6)"></div>
    <div class="modetog" id="modetog">
      <button data-m="student" class="on" onclick="setMode('student')">Student</button>
      <button data-m="parent" onclick="setMode('parent')">Parent</button>
    </div>
  </div>
</header>
<div class="wrap" id="app"></div>
<footer>Built around the “4‑Stage Thinking Guide” (Understand · Decide · Solve · Check) and the six problem‑solving heuristics, with levels P1–P6 following the 2021 Primary Mathematics Syllabus.</footer>

<script>
"use strict";
/* =====================================================================
   MATH HEURISTICS LAB  —  single-file app
   Levels P1–P6 follow the 2021 Primary Mathematics Syllabus (Number & Algebra)

/* ---------------------- SVG BAR MODEL RENDERER ----------------- */
/* rows: [{label, units:int, extras:[{val,kind}], faint:bool, valPerUnit:optional}]
   opt: {uw, totalText, totalRows:[i..], showUnitTag} */
function barSVG(rows, opt){
  opt=opt||{};
  const uw=opt.uw||52, rh=42, gap=14, labelW=opt.labelW||100, padL=8, padT=12, rightPad=opt.totalText?64:14;
  let maxBlocks=0;
  rows.forEach(r=>{const b=(r.units||0)+(r.extras?r.extras.length:0); if(b>maxBlocks)maxBlocks=b;});
  const chartW=labelW+padL+maxBlocks*uw+rightPad;
  const h=padT*2+rows.length*(rh+gap)-gap;
  let s=`<svg class="viz" viewBox="0 0 ${chartW} ${h}" style="width:100%;max-width:${chartW}px;height:auto;display:block" preserveAspectRatio="xMinYMin meet" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif">`;
  const ufills=['var(--u)']; const xf=['var(--x1)','var(--x2)','var(--x3)','#e0455e'];
  rows.forEach((r,ri)=>{
    const y=padT+ri*(rh+gap);
    const op=r.faint?0.28:1;
    s+=`<text x="0" y="${y+rh/2+5}" font-size="14" font-weight="700" fill="var(--ink)" opacity="${op}">${esc(r.label)}</text>`;
    let x=labelW+padL;
    for(let u=0;u<(r.units||0);u++){
      s+=`<rect x="${x}" y="${y}" width="${uw}" height="${rh}" rx="6" fill="var(--u)" opacity="${op}"/>`;
      const tag=r.valPerUnit!=null? fmtNum(r.valPerUnit) : (opt.unitTag||'1u');
      s+=`<text x="${x+uw/2}" y="${y+rh/2+5}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" opacity="${op}">${tag}</text>`;
      x+=uw+2;
    }
    (r.extras||[]).forEach((e,ei)=>{
      const f=xf[ei%xf.length];
      s+=`<rect x="${x}" y="${y}" width="${uw}" height="${rh}" rx="6" fill="${f}" opacity="${op}"/>`;
      s+=`<text x="${x+uw/2}" y="${y+rh/2+5}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" opacity="${op}">${esc(e.val)}</text>`;
      x+=uw+2;
    });
  });
  if(opt.totalText){
    const idx=opt.totalRows||rows.map((r,i)=>i);
    const y1=padT+idx[0]*(rh+gap);
    const y2=padT+idx[idx.length-1]*(rh+gap)+rh;
    const bx=chartW-rightPad+14;
    s+=`<path d="M ${bx-6} ${y1} q 6 0 6 8 L ${bx} ${(y1+y2)/2-8} q 0 8 7 8 q -7 0 -7 8 L ${bx} ${y2-8} q 0 8 -6 8" fill="none" stroke="var(--muted)" stroke-width="2"/>`;
    s+=`<text x="${bx+10}" y="${(y1+y2)/2+5}" font-size="14" font-weight="800" fill="var(--ink)">${esc(opt.totalText)}</text>`;
  }
  s+=`</svg>`;
  return `<div class="vizwrap">${s}</div>`;
}
function tableHTML(headers, rows){
  let s='<div class="vizwrap"><table class="dtab"><tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr>';
  rows.forEach(r=>{ s+='<tr>'+r.map(c=>{ if(c&&c.cls) return `<td class="${c.cls}">${c.v}</td>`; return `<td>${c}</td>`;}).join('')+'</tr>'; });
  return s+'</table></div>';
}
/* Draws Pattern 1..maxN as checkerboard-coloured triangular staircases.
   Star cells (blue) = ceil(n/2)^2 ; Square cells (orange) = floor(n/2)*(floor(n/2)+1). */
function patternFig(maxN){
  const cell=22,gap=30,padT=8,labelH=20;
  let totalW=8;for(let n=1;n<=maxN;n++)totalW+=n*cell+gap;
  const figH=maxN*cell,Hh=padT+figH+labelH;
  let s=`<svg class="viz" viewBox="0 0 ${totalW} ${Hh}" style="width:100%;max-width:${totalW}px;height:auto;display:block" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif">`;
  let x0=4;
  for(let n=1;n<=maxN;n++){const fw=n*cell,yTop=padT+(maxN-n)*cell;
    for(let i=1;i<=n;i++){for(let c=1;c<=i;c++){
      const star=((i+c)%2===1),cx=x0+(c-1)*cell,cy=yTop+(i-1)*cell;
      s+=`<rect x="${cx}" y="${cy}" width="${cell-3}" height="${cell-3}" rx="3" fill="${star?'var(--u)':'var(--x1)'}"/>`;
      if(star)s+=`<text x="${cx+(cell-3)/2}" y="${cy+(cell-3)/2+3.6}" text-anchor="middle" font-size="11" fill="#fff">★</text>`;
    }}
    s+=`<text x="${x0+fw/2}" y="${padT+figH+labelH-4}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">Pattern ${n}</text>`;
    x0+=fw+gap;
  }
  return `<div class="vizwrap">${s}</svg></div>`;
}

function bldRecalc(){

    let ru=0,re=0;r.blocks.forEach(bk=>{if(bk.t==='u')ru++;else re+=bk.v;});
    el.textContent='= '+fmtNum(ru*uv+re);});
}

function genProblem(id,lv){
  if(id==='H1')return gH1(lv);
  if(id==='H2')return gH2(lv);
  if(id==='H3')return gH3(lv);
  if(id==='H4')return gH4(lv);
  if(id==='H5')return gH5(lv);
  return gH6(lv);
}
function gH1(lv){const it=pick(ITEMS),pr=pick2(NAMES),A=pr[0],B=pr[1],n=lv.n;
  if(n===1){const s=rint(5,25),d=rint(2,12),T=2*s+d;
    return {q:`${A} and ${B} have ${T} ${it} altogether. ${A} has ${d} more ${it} than ${B}. How many ${it} does ${B} have?`,type:'num',answer:s,
      hint:`Draw two bars. ${B} = 1 unit; ${A} = 1 unit + ${d}. So 2 units + ${d} = ${T}.`,
      sol:`2 units = ${T} − ${d} = ${T-d}; 1 unit = ${(T-d)/2}. ${B} has ${s}.`};}
  if(n===2){const u=rint(20,160),k=pick([2,3,4]),T=u*(k+1);
    return {q:`${A} has ${k} times as many ${it} as ${B}. Together they have ${T} ${it}. How many does ${B} have?`,type:'num',answer:u,
      hint:`${B} = 1 unit, ${A} = ${k} units, so ${k+1} units = ${T}.`,sol:`${k+1} units = ${T}; 1 unit = ${u}. ${B} has ${u}.`};}
  if(n===3){const u=rint(80,600),a=rint(20,150),b=rint(20,150),T=3*u+2*a+b,rich=u+a;
    return {q:`${A}, ${B} and Cara have ${T} ${it} altogether. ${B} has ${a} more than ${A}. Cara has ${b} more than ${B}. How many ${it} does ${B} have?`,type:'num',answer:rich,
      hint:`Smallest is ${A} = 1 unit. ${B} = 1u + ${a}. Cara = 1u + ${a} + ${b}. So 3 units + ${2*a+b} = ${T}.`,

function gH2(lv){const n=lv.n;

function gH4(lv){const n=lv.n;

function renderPractice(id,b){
  const lv=L();
  if(!state.prac||state.prac.id!==id||state.prac.level!==lv.n)newQuestion(id);
  const q=state.prac.q,sc=state.prac.score,pctNow=sc.total?Math.round(sc.right/sc.total*100):0;
  let ans;
  if(q.type==='mc'){
    ans=`<div class="mcgrid" id="mcg">${q.choices.map((c,i)=>`<button data-i="${i}" onclick="pickMC(${i})">${esc(c)}</button>`).join('')}</div>`;
  } else {
    ans=`<div class="ansrow"><input id="pin" type="text" inputmode="decimal" placeholder="${q.unit==='$'?'e.g. 24 (or 24.50)':'your answer'}"> <button class="btn" onclick="checkAns()">Check</button></div>`;
  }
  b.innerHTML=`<div class="panel">
    <div class="scorebar" id="scbar">
      <span class="scorebadge">Level ${lv.n} · ${lv.grade}</span>
      <span class="scorebadge">Score: ${sc.right}/${sc.total} (${pctNow}%)</span>
      <span class="scorebadge">Best: ${prog(id).best}%</span>
    </div>
    <div class="pcard">
      <div class="pq">${q.q}</div>
      ${ans}
      <div class="feedback" id="fb"></div>
    </div>
    <div class="stepctrl">
      <button class="btn ghost sm" onclick="showHint()">Show hint</button>
      <button class="btn sm" onclick="newQuestion('${id}');renderTab('${id}')">New question →</button>
    </div>
    ${id==='H1'?`<div class="drawwrap">
      <button class="drawtoggle" onclick="togglePracDraw()">${state.pracDraw?'▾ Hide model':'▸ Draw a model to help'}</button>
      ${state.pracDraw?`<div class="buildembed"><p class="drawcap">Sketch the bars for this question — add equal <b style="color:var(--u)">unit</b> blocks and labelled <b style="color:var(--accent)">number</b> blocks, type the grand total, then read off what 1 unit is.</p><div id="pracbuild"></div></div>`:''}
    </div>`:''}
    <div class="parentonly note"><b>Parent / teacher note:</b> ${parentNote(id)} Problems here follow Level ${lv.n} (${lv.grade}) scope: ${lv.scope}</div>
  </div>`;
  const pin=document.getElementById('pin');
  if(pin){pin.addEventListener('keydown',e=>{if(e.key==='Enter')checkAns();});if(!state.pracDraw)pin.focus();}
  if(id==='H1'&&state.pracDraw){const pb=document.getElementById('pracbuild');if(pb)renderBuilder(pb,true);}
}
function togglePracDraw(){state.pracDraw=!state.pracDraw;renderTab(state.arg);}
function newQuestion(id){
  const same=(state.prac&&state.prac.id===id&&state.prac.level===L().n);
  const keep=same?state.prac.score:{right:0,total:0};
  state.prac={id,q:genProblem(id,L()),answered:false,picked:null,score:keep,level:L().n};
}
function showHint(){const fb=document.getElementById('fb');if(!fb)return;fb.className='feedback show ok';fb.innerHTML='<b>Hint:</b> '+state.prac.q.hint;}
function checkAns(){if(state.prac.answered)return;const pin=document.getElementById('pin');if(!pin)return;const raw=(pin.value||'').trim();
  if(raw==='')return;const val=parseFloat(raw.replace(/[^0-9.\-]/g,''));if(isNaN(val))return;
  finishAns(approxEq(val,state.prac.q.answer));pin.disabled=true;}
function pickMC(i){if(state.prac.answered||!state.prac.q.choices)return;const q=state.prac.q;const ok=q.choices[i]===q.answer;state.prac.picked=i;
  document.querySelectorAll('#mcg button').forEach((btn,j)=>{btn.disabled=true;if(q.choices[j]===q.answer)btn.classList.add('right');else if(j===i)btn.classList.add('wrong');});
  finishAns(ok);}
function finishAns(ok){
  const id=state.prac.id,q=state.prac.q,sc=state.prac.score;state.prac.answered=true;
  sc.total++;if(ok)sc.right++;
  const p=prog(id);p.attempts++;const pctNow=Math.round(sc.right/sc.total*100);if(pctNow>p.best)p.best=pctNow;save();
  if(sc.total%5===0){const h=HEUR.find(x=>x.id===id);mhlEmit(id,h?h.name:id,pctNow,sc.total);}
  const fb=document.getElementById('fb');fb.className='feedback show '+(ok?'ok':'no');
  fb.innerHTML=(ok?'<b>Correct!</b> ':'<b>Not quite — here’s how:</b> ')+`<span class="sol">${q.sol}</span>`;
  const sb=document.getElementById('scbar');
  if(sb)sb.innerHTML=`<span class="scorebadge">Level ${L().n} · ${L().grade}</span>
    <span class="scorebadge">Score: ${sc.right}/${sc.total} (${pctNow}%)</span>
    <span class="scorebadge">Best: ${p.best}%</span>`;
}

/* ---------------------- BOOT ----------------- */
function go(view,arg){ state.view=view; state.arg=arg; render(); window.scrollTo(0,0); }
function setMode(m){ state.mode=m; document.body.classList.toggle('parent',m==='parent');
  document.querySelectorAll('#modetog button').forEach(b=>b.classList.toggle('on',b.dataset.m===m)); save(); render(); }
function setLevel(n){ state.level=n; save(); renderLevelBox(); render(); }
function askLevel(n){
  if(n===state.level)return;
  const l=LEVELS[n-1];
  uiConfirm('Change to Level '+n+' ('+l.grade+')?',
    'This sets the <b>Practice</b> questions to '+l.grade+' difficulty (numbers '+l.digits+'). The lessons stay the same. Continue?',
    'Yes, switch to '+l.grade, function(){ setLevel(n); });
}
function uiConfirm(title, body, yesLabel, onYes){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML='<div class="modal-card"><h3>'+title+'</h3><p>'+body+'</p>'+
    '<div class="modal-btns"><button class="btn ghost" id="mc-no">Cancel</button>'+
    '<button class="btn" id="mc-yes">'+yesLabel+'</button></div></div>';
  document.body.appendChild(bg);
  bg.querySelector('#mc-no').onclick=function(){ bg.remove(); };
  bg.querySelector('#mc-yes').onclick=function(){ bg.remove(); onYes(); };
  bg.onclick=function(e){ if(e.target===bg) bg.remove(); };
}
function renderLevelBox(){
  const box=document.getElementById('lvlbox');
  box.innerHTML='<span class="lvllabel">Level</span>'+LEVELS.map(l=>
    `<button class="${l.n===state.level?'on':''}" title="${l.grade} · ages ${l.age} (tap to change — needs confirm)" onclick="askLevel(${l.n})">${l.n}</button>`).join('');
}
function render(){
  const v=state.view||'home';
  if(v==='home') return renderHome();
  if(v==='decision') return renderDecision();
  if(v==='heur') return renderHeur(state.arg);
  renderHome();
}
