<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocabulary Builder · Primary English</title>
    <meta
      name="description"
      content="Adaptive vocabulary practice for the Primary English paper — learn the words the exam tests, step by step."
    />
    <link rel="stylesheet" href="./styles.css" />
    <!-- Apply the saved (or OS) theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vb.theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">VB</span>
        <span>Vocabulary&nbsp;Builder <em>· Primary English</em></span>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Switch theme">🌙</button>
    </header>
    <main id="app" class="wrap"><p class="loading">Loading…</p></main>
    <footer class="foot">
      Standalone web app · runs entirely in your browser · no account needed.
    </footer>
    <!--
      The whole app is this one module + the shared vocabulary engine. There is
      no backend, no framework and no build step: open it on any static host.
    -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
