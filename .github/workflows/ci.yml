name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Syntax-check the tutor-match backend files (no execution, so the
      # server never boots and CI can't hang on app.listen / DB connect).
      - name: Syntax check
        run: git ls-files -z 'server.js' 'config/*.js' 'routes/*.js' 'models/*.js' 'middleware/*.js' 'utils/*.js' | xargs -0 -n1 node --check

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
