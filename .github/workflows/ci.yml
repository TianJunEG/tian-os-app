name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generate the Prisma v7 client and esbuild-bundle the TS output to ESM JS.
      # prisma generate needs no real DB — DATABASE_URL is required by the config
      # schema but no connection is made during code generation.
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost/ci
        run: npm run postgres:prisma:generate

      # Syntax-check every backend file (no execution, so the server never
      # boots and CI can't hang on app.listen / DB connect). Catches errors in
      # files the test suite doesn't import.
      - name: Syntax check
        run: git ls-files -z 'server.js' 'config/*.js' 'routes/*.js' 'models/*.js' 'middleware/*.js' 'utils/*.js' | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright pilot-gate)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/tian-os-e2e
      JWT_SECRET: ci-e2e-test-secret-not-for-production
      NODE_ENV: test
      QA_DISABLE_RATE_LIMIT: "1"
      AUTO_SEED_PILOT_ACCOUNTS: "1"
      DATABASE_URL: postgresql://ci:ci@localhost/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run postgres:prisma:generate

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run pilot-gate E2E tests
        run: npm run test:pilot-gate
        working-directory: frontend

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report-pilot/
          retention-days: 7
