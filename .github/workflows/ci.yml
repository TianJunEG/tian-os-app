name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Syntax-check every backend file (no execution, so the server never
      # boots and CI can't hang on app.listen / DB connect). Catches errors in
      # files the test suite doesn't import.
      - name: Syntax check
        run: git ls-files -z 'server.js' 'config/*.js' 'routes/*.js' 'models/*.js' 'middleware/*.js' 'utils/*.js' | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
