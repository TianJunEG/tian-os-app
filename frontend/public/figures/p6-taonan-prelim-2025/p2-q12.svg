<svg width="420" height="380" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380">
<!-- Parallelogram ABCD: A(70,100) B(270,100) C(320,210) D(120,210)
     Rhombus CFDE: C(320,210) F(220,343) D(120,210) E(220,77)
     G and H on AB where rhombus sides cross it.
     74° at F, 12° at D, angle w at H. -->

<!-- Parallelogram ABCD -->
<polygon points="70,100 270,100 320,210 120,210" fill="none" stroke="black" stroke-width="2"/>

<!-- Rhombus CFDE -->
<polygon points="320,210 220,343 120,210 220,77" fill="none" stroke="black" stroke-width="2"/>

<!-- Tick marks on rhombus equal sides -->
<!-- CF midpoint (270,276): perpendicular direction (4.9, 3.7) -->
<line x1="265" y1="273" x2="275" y2="280" stroke="black" stroke-width="1.2"/>
<!-- FD midpoint (170,276) -->
<line x1="165" y1="273" x2="175" y2="280" stroke="black" stroke-width="1.2"/>
<!-- DE midpoint (170,144) -->
<line x1="165" y1="140" x2="175" y2="147" stroke="black" stroke-width="1.2"/>
<!-- EC midpoint (270,144) -->
<line x1="265" y1="140" x2="275" y2="147" stroke="black" stroke-width="1.2"/>

<!-- Vertex labels -->
<text x="55" y="98" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="black">A</text>
<text x="280" y="98" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="black">B</text>
<text x="335" y="215" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="black">C</text>
<text x="105" y="215" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="black">D</text>
<text x="220" y="68" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="black">E</text>
<text x="220" y="362" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="black">F</text>

<!-- G and H on AB (where rhombus sides DE and EC cross AB) -->
<circle cx="203" cy="100" r="2" fill="black"/>
<text x="203" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">G</text>
<circle cx="237" cy="100" r="2" fill="black"/>
<text x="237" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">H</text>

<!-- 74° at F -->
<text x="220" y="322" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">74°</text>

<!-- 12° at D (angle ADG) -->
<text x="145" y="195" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">12°</text>

<!-- Angle w at H (above AB) -->
<text x="237" y="82" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="black" font-style="italic">w</text>
</svg>
