<svg width="360" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360">
<!-- Pie chart of hobbies. Total = 240.
     Jogging 30, Reading 48, Gaming 62, Dancing 40, Cycling 60.
     Cycling = 60/240 = 1/4 of circle = 90° sector, marked with right-angle square at centre.
     Sectors sized proportionally: angles = value/240 * 360°. -->
<!-- Angles: Jogging=45°, Reading=72°, Gaming=93°, Dancing=60°, Cycling=90° -->

<circle cx="180" cy="170" r="140" fill="none" stroke="black" stroke-width="2"/>

<!-- Sector boundaries as radii from centre.
     Starting at 12 o'clock (top, 270° in math coords) going clockwise:
     Jogging: 270° to 270°+45°=315°
     Reading: 315° to 315°+72°=387°=27°
     Gaming:  27° to 27°+93°=120°
     Dancing: 120° to 120°+60°=180°
     Cycling: 180° to 180°+90°=270° (back to start) -->

<!-- Radius lines (sector boundaries) -->
<!-- 270° (top) -->
<line x1="180" y1="170" x2="180" y2="30" stroke="black" stroke-width="1"/>
<!-- 315° (Jogging/Reading boundary) -->
<line x1="180" y1="170" x2="279" y2="71" stroke="black" stroke-width="1"/>
<!-- 27° (Reading/Gaming boundary) -->
<line x1="180" y1="170" x2="305" y2="107" stroke="black" stroke-width="1"/>
<!-- 120° (Gaming/Dancing boundary) -->
<line x1="180" y1="170" x2="110" y2="291" stroke="black" stroke-width="1"/>
<!-- 180° (Dancing/Cycling boundary) -->
<line x1="180" y1="170" x2="40" y2="170" stroke="black" stroke-width="1"/>

<!-- Cycling sector shading (180° to 270°, the left-upper quarter) -->
<path d="M 180 170 L 40 170 A 140 140 0 0 1 180 30 Z" fill="#cccccc" stroke="none"/>

<!-- Right-angle square mark at centre for Cycling's 90° sector -->
<line x1="180" y1="170" x2="180" y2="158" stroke="black" stroke-width="1"/>
<line x1="180" y1="170" x2="168" y2="170" stroke="black" stroke-width="1"/>
<rect x="168" y="158" width="12" height="12" fill="none" stroke="black" stroke-width="1"/>

<!-- Labels: name + value inside each sector -->
<!-- Jogging (centroid ~292°) -->
<text x="228" y="82" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Jogging</text>
<text x="228" y="95" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">30</text>

<!-- Reading (centroid ~351°) -->
<text x="270" y="135" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Reading</text>
<text x="270" y="148" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">48</text>

<!-- Gaming (centroid ~73°) -->
<text x="200" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Gaming</text>
<text x="200" y="268" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">62</text>

<!-- Dancing (centroid ~150°) -->
<text x="108" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Dancing</text>
<text x="108" y="243" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">40</text>

<!-- Cycling (centroid ~225°, shaded sector) -->
<text x="120" y="110" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Cycling</text>
</svg>
