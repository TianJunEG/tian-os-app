<svg width="360" height="340" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340">
<!-- Two straight lines AB and CD crossing at O, plus a third ray from O.
     30° between OC and the third ray (above AB), 125° from OC to OB (above AB).
     Right-angle mark and angle m below AB. -->

<!-- Line AB (horizontal) -->
<line x1="40" y1="170" x2="320" y2="170" stroke="black" stroke-width="2" stroke-linecap="round"/>
<!-- Line CD: OC at ~125° from +x, OD at ~305° from +x -->
<line x1="111" y1="72" x2="249" y2="268" stroke="black" stroke-width="2" stroke-linecap="round"/>
<!-- Third ray from O going upper-left (~155° from +x) -->
<line x1="180" y1="170" x2="89" y2="128" stroke="black" stroke-width="2" stroke-linecap="round"/>

<!-- Labels A, B, C, D -->
<text x="30" y="180" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="black">A</text>
<text x="330" y="180" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="black">B</text>
<text x="100" y="60" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="black">C</text>
<text x="260" y="280" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="black">D</text>

<!-- 30° arc (from OC direction to third ray direction, above AB) -->
<path d="M 165.7,149.5 A 25 25 0 0 0 157.3,159.4" fill="none" stroke="black" stroke-width="1"/>
<text x="148" y="148" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">30°</text>

<!-- 125° arc (from OB direction to OC direction, above AB) -->
<path d="M 210,170 A 30 30 0 0 0 162.8,145.4" fill="none" stroke="black" stroke-width="1"/>
<text x="200" y="132" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">125°</text>

<!-- Right-angle square mark below AB (between OB and OD region) -->
<rect x="180" y="170" width="12" height="12" fill="none" stroke="black" stroke-width="1" transform="rotate(35, 180, 170)"/>

<!-- Angle m label (below AB, in the region between OD and OA) -->
<text x="160" y="210" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="black" font-style="italic">m</text>
</svg>
