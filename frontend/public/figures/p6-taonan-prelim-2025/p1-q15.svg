<svg width="360" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360">
<!-- Three identical right-angled triangles in a pinwheel around center (180,200).
     Each triangle: legs 16cm (80px) and 12cm (60px), hypotenuse 20cm (100px).
     Right angle at the outer vertex of each. Triangles rotated 120° apart.
     Total vertical span of legs = 16 + 16*cos(60°) = 24cm. -->

<!-- Triangle 1 (top-right): center→(180,120)→(240,120) -->
<polygon points="180,200 180,120 240,120" fill="none" stroke="black" stroke-width="2"/>
<!-- Right-angle mark at (180,120) — axes-aligned -->
<polyline points="190,120 190,130 180,130" fill="none" stroke="black" stroke-width="1"/>

<!-- Triangle 2 (bottom-right): center→(249,240)→(219,292) -->
<polygon points="180,200 249,240 219,292" fill="none" stroke="black" stroke-width="2"/>
<!-- Right-angle mark at (249,240) -->
<polyline points="240,235 235,244 244,249" fill="none" stroke="black" stroke-width="1"/>

<!-- Triangle 3 (bottom-left): center→(111,240)→(81,188) -->
<polygon points="180,200 111,240 81,188" fill="none" stroke="black" stroke-width="2"/>
<!-- Right-angle mark at (111,240) -->
<polyline points="120,235 115,226 106,231" fill="none" stroke="black" stroke-width="1"/>

<!-- 24 cm measurement: vertical arrows on the left, from y=120 to y=240 -->
<line x1="45" y1="120" x2="45" y2="240" stroke="black" stroke-width="1"/>
<!-- Up arrow -->
<polygon points="45,120 41,130 49,130" fill="black"/>
<!-- Down arrow -->
<polygon points="45,240 41,230 49,230" fill="black"/>
<text x="42" y="185" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black" transform="rotate(-90,42,185)">24 cm</text>

<!-- 20 cm label along hypotenuse of T1: (180,200)→(240,120) -->
<text x="222" y="152" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">20 cm</text>
</svg>
