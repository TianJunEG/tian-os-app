# Render Blueprint — backend API only.
# Frontend is deployed on Vercel for pilot.
# Import this repo at https://dashboard.render.com → New → Blueprint.
# Values marked `sync: false` are secrets/per-environment and are set in the
# Render dashboard (they are intentionally not stored in the repo).
services:
  # ---- Express API ----
  - type: web
    name: tian-os-api
    runtime: node
    rootDir: .
    plan: starter # always-on; required for the persistent disk below
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CORS_ORIGIN
        sync: false # set to Vercel URL(s), comma-separated
      - key: FRONTEND_URL
        sync: false # canonical Vercel production URL
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_SERVICE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PARTNERSHIPS_NOTIFICATION_EMAIL
        sync: false
