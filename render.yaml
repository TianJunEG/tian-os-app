# Render Blueprint — backend API only.
# Frontend is deployed on Vercel for pilot.
# Import this repo at https://dashboard.render.com → New → Blueprint.
# Values marked `sync: false` are secrets/per-environment and are set in the
# Render dashboard (they are intentionally not stored in the repo).
services:
  # ---- Express API ----
  - type: web
    name: tian-os-api
    runtime: node
    rootDir: .
    plan: starter # always-on
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CORS_ORIGIN
        sync: false # set to Vercel URL(s), comma-separated
      - key: FRONTEND_URL
        sync: false # canonical Vercel production URL
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_SERVICE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PARTNERSHIPS_NOTIFICATION_EMAIL
        sync: false
      # Phase 1 scaling: REDIS_URL powers the distributed rate limiter and the
      # background job queue. Wired from the managed Redis below.
      - key: REDIS_URL
        fromService:
          type: redis
          name: tian-os-redis
          property: connectionString
      # Set to "1" once R2 is configured: all upload categories live in R2 (Phase 2
      # complete), so the worker can read them. Leave unset to run AI inline.
      - key: JOB_QUEUE_ENABLED
        sync: false
      # Phase 3: pool size per web replica. With N replicas, total Atlas connections
      # = N × MONGO_MAX_POOL_SIZE. Keep N × 10 within your Atlas tier's limit.
      - key: MONGO_MAX_POOL_SIZE
        value: "10"
      # Cloudflare R2 (object storage — all upload categories: Phase 2 complete).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false

  # ---- Background worker (paper-analysis OCR/AI off the request path) ----
  #
  # All upload categories now live in R2 (Phase 2 complete). The worker reads
  # uploads from R2 and does NOT need the web disk. To enable the queue:
  # configure the R2_* vars on BOTH services, then set JOB_QUEUE_ENABLED=1.
  - type: worker
    name: tian-os-worker
    runtime: node
    rootDir: .
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: tian-os-redis
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: "2"
      # Worker runs lower concurrency than web, so fewer DB connections needed.
      - key: MONGO_MAX_POOL_SIZE
        value: "5"
      # Cloudflare R2 — the worker reads uploaded papers from here.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false

  # ---- Managed Redis (rate-limiter counters + BullMQ queue) ----
  - type: redis
    name: tian-os-redis
    plan: starter
    maxmemoryPolicy: noeviction # BullMQ requires jobs are never evicted
    ipAllowList: [] # internal-only; reachable from the services above
