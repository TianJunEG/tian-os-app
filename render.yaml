# Render Blueprint — backend API only.
# Frontend is deployed on Vercel for pilot.
# Import this repo at https://dashboard.render.com → New → Blueprint.
# Values marked `sync: false` are secrets/per-environment and are set in the
# Render dashboard (they are intentionally not stored in the repo).
services:
  # ---- Express API ----
  - type: web
    name: tian-os-api
    runtime: node
    rootDir: .
    plan: starter # always-on; required for the persistent disk below
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CORS_ORIGIN
        sync: false # set to Vercel URL(s), comma-separated
      - key: FRONTEND_URL
        sync: false # canonical Vercel production URL
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_SERVICE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PARTNERSHIPS_NOTIFICATION_EMAIL
        sync: false
      # Phase 1 scaling: REDIS_URL powers the distributed rate limiter and the
      # background job queue. Wired from the managed Redis below.
      - key: REDIS_URL
        fromService:
          type: redis
          name: tian-os-redis
          property: connectionString
      # Job queue stays OFF until the worker can read uploads (see worker note).
      # Set to "1" in the dashboard only after Phase 2 (object storage) lands.
      - key: JOB_QUEUE_ENABLED
        sync: false

  # ---- Background worker (paper-analysis OCR/AI off the request path) ----
  #
  # ⚠️ Render persistent disks attach to ONE service, so this worker CANNOT mount
  # the web service's `uploads` disk. The paper-analysis pipeline reads uploaded
  # files from their on-disk storageKey, so the queue path only works once
  # uploads move to shared object storage (Phase 2). Until then:
  #   - keep JOB_QUEUE_ENABLED unset/0 on Render (web runs the pipeline inline),
  #   - the full enqueue→worker path is exercised locally, where `npm start` and
  #     `npm run worker` share one filesystem + a local Redis.
  # The service is defined here so the deploy wiring is ready for Phase 2.
  - type: worker
    name: tian-os-worker
    runtime: node
    rootDir: .
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: tian-os-redis
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: "2"

  # ---- Managed Redis (rate-limiter counters + BullMQ queue) ----
  - type: redis
    name: tian-os-redis
    plan: starter
    maxmemoryPolicy: noeviction # BullMQ requires jobs are never evicted
    ipAllowList: [] # internal-only; reachable from the services above
